name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: >-
        github-actions-test-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          pip --version
          python -m django --version
          coverage --version

      - name: Compile Python source
        run: |
          python -m compileall apps config tests scripts

      - name: Run full backend verification
        run: |
          python scripts/check_backend.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload generated OpenAPI schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-openapi-schema
          path: backend/openapi-schema.yml
          if-no-files-found: error
          retention-days: 14