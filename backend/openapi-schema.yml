openapi: 3.0.3
info:
  title: Kafedra Management API
  version: 1.0.0
  description: |-
    API системы автоматизации учебной нагрузки кафедры.

    Аутентификация выполняется JWT-токеном:

    `Authorization: Bearer <access_token>`
paths:
  /api/v1/academics/academic-years/:
    get:
      operationId: academics_academic_years_list
      description: |-
        Базовый ViewSet для моделей с мягким удалением.

        Дочерний ViewSet должен определить:
        - model;
        - get_queryset();
        - при необходимости scope_queryset();
        - permission_classes.
      parameters:
      - in: query
        name: end_year
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_current
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: start_year
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          title: Статус
          enum:
          - closed
          - open
        description: |-
          * `open` - Открыт
          * `closed` - Закрыт
      tags:
      - academics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicYearList'
          description: ''
    post:
      operationId: academics_academic_years_create
      description: |-
        Базовый ViewSet для моделей с мягким удалением.

        Дочерний ViewSet должен определить:
        - model;
        - get_queryset();
        - при необходимости scope_queryset();
        - permission_classes.
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
