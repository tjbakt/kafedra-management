      operationId: academics_academic_years_restore_create
      description: Восстанавливает объект из архива. Операция может быть запрещена
        правами доступа или состоянием учебного года.
      summary: Восстановить запись
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Учебный год.
        required: true
      tags:
      - academics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                ОшибкаВалидации:
                  value:
                    success: false
                    status_code: 400
                    error:
                      code: validation_error
                      message: Ошибка проверки данных.
                      fields:
                        name:
                        - message: Это поле обязательно.
                          code: required
                      details: null
                  summary: Ошибка валидации
          description: Ошибка проверки данных.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                ТребуетсяАутентификация:
                  value:
                    success: false
                    status_code: 401
                    error:
                      code: authentication_required
                      message: Учетные данные не были предоставлены.
                      fields: null
                      details: null
                  summary: Требуется аутентификация
          description: Требуется аутентификация.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                НедостаточноПрав:
                  value:
                    success: false
                    status_code: 403
                    error:
                      code: permission_denied
                      message: Доступ запрещён.
                      fields: null
                      details: null
                  summary: Недостаточно прав
          description: Недостаточно прав.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                ОбъектНеНайден:
                  value:
                    success: false
                    status_code: 404
                    error:
                      code: not_found
                      message: Запрашиваемый ресурс не найден.
                      fields: null
                      details: null
                  summary: Объект не найден
          description: Ресурс не найден.
